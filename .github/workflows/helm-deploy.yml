name: Deploy to Kubernetes with Helm

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind-cluster

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Build Docker image
        run: |
          docker build -t priprav1ch228/my-app:latest .

      - name: Load image into kind
        run: |
          kind load docker-image priprav1ch228/my-app:latest --name kind-cluster

      - name: Run Database Migrations with Flyway
        run: |
          wget -qO- https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/9.22.3/flyway-commandline-9.22.3-linux-x64.tar.gz | tar xvz
          ./flyway-9.22.3/flyway -url=jdbc:postgresql://localhost:5432/mydb -user=user -password=password -locations=filesystem:migrations migrate

      - name: Clean up old release
        run: |
          helm uninstall my-release || true

      - name: Deploy with Helm
        run: |
          helm upgrade --install my-release ./helm \
            --set image.repository=priprav1ch228/my-app \
            --set image.tag=latest

      - name: Verify Deployment
        run: |
          echo "Ожидаем запуска подов..."
          sleep 20
          kubectl get pods
          kubectl get services
