stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: priprav1ch228/my-app:$CI_COMMIT_SHORT_SHA

build_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - main

deploy_to_k8s:
  stage: deploy
  image: alpine/helm:3.12.0
  script:
    - helm upgrade --install my-release ./helm --set image.tag=$CI_COMMIT_SHORT_SHA
  environment:
    name: production
  only:
    - main
